services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-router-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lead_router
    ports:
      # 5432 на хосте обычно уже занят — держим демо на своём порту
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_router"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
